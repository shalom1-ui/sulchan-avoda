<meta charset="utf-8">
<title>שולחן עבודה - ניהול</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%237ba63f'/%3E%3Cstop offset='40%25' stop-color='%231f8f7a'/%3E%3Cstop offset='70%25' stop-color='%235b4a86'/%3E%3Cstop offset='100%25' stop-color='%239c2b5e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='6' width='56' height='40' rx='7' fill='url(%23g)'/%3E%3Crect x='9' y='11' width='46' height='30' rx='4' fill='white'/%3E%3Ctext x='32' y='31' font-family='Arial,sans-serif' font-weight='800' font-size='15' text-anchor='middle' fill='%235b4a86'%3Eשע%3C/text%3E%3Crect x='26' y='46' width='12' height='7' fill='url(%23g)'/%3E%3Crect x='16' y='55' width='32' height='4' rx='2' fill='url(%23g)'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d; --surface:#1a2029; --surface-2:#212836; --line:#2b3242;
    --text:#eef0f4; --muted:#8c94a6; --accent:#2fb08d; --accent-soft:#1f6a56;
    --warn:#e8a33d; --danger:#d9614f; --radius:14px;
    /* צבעי הלוגו של העמותה - גרדיאנט ירוק->טורקיז->סגול->מג'נטה, כמו בקובץ הלוגו שהתקבל */
    --logo-green:#7ba63f; --logo-teal:#1f8f7a; --logo-purple:#5b4a86; --logo-magenta:#9c2b5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{direction:rtl;font-family:'Rubik',sans-serif;min-height:100vh;}
  a{color:var(--accent);}
  input,select,textarea,button{font-family:'Rubik',sans-serif;}
  input,select,textarea{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14.5px;outline:none;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  button{
    background:var(--accent);color:#0d1310;border:none;border-radius:10px;
    padding:10px 16px;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  button.danger{background:var(--danger);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .muted{color:var(--muted);font-size:13px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge.pending{background:rgba(232,163,61,.15);color:var(--warn);}
  .badge.done{background:rgba(47,176,141,.15);color:var(--accent);}
  .badge.not_done,.badge.issue{background:rgba(217,97,79,.15);color:var(--danger);}
  /* רקע גרדיאנט עדין שזז לאט - למסך הכניסה ולכותרת הקבועה (ר' בקשת המשתמש ללוגו+רקע מתחלף) */
  @keyframes gradientDrift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  #loginScreen{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:linear-gradient(120deg,#12161d,#17222a,#1c1a2e,#182a22,#12161d);
    background-size:400% 400%;animation:gradientDrift 26s ease infinite;
  }
  #loginBox{width:100%;max-width:380px;}
  #appShell{display:none;}
  header{
    display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(100deg,var(--surface),#1b2432,#221c30,var(--surface));
    background-size:300% 300%;animation:gradientDrift 34s ease infinite;
    position:sticky;top:0;z-index:5;
  }
  header .title{font-weight:800;font-size:17px;}
  /* לוגו העמותה - קובץ תמונה אמיתי (public/logo.png, מוגש דרך GET /logo.png), לא שחזור ב-CSS */
  .logo-row{display:flex;align-items:center;gap:10px;}
  .logo-login{max-width:230px;width:100%;height:auto;display:block;}
  .logo-header{height:36px;width:auto;display:block;}
  nav{display:flex;gap:6px;padding:10px 24px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);}
  nav button{background:transparent;color:var(--muted);border:1px solid transparent;white-space:nowrap;}
  nav button.active{background:var(--surface-2);color:var(--accent);border-color:var(--accent-soft);}
  main{padding:20px 24px;max-width:1000px;margin:0 auto;}
  .bell{position:relative;cursor:pointer;font-size:20px;}
  .bell .dot{position:absolute;top:-4px;left:-4px;background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-family:'JetBrains Mono',monospace;}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .msg{max-width:70%;padding:9px 13px;border-radius:12px;margin-bottom:8px;font-size:14px;}
  .msg.mine{background:var(--accent-soft);margin-inline-start:auto;}
  .msg.theirs{background:var(--surface-2);}
  .msg .meta{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .status-line{font-size:13px;margin-top:8px;min-height:16px;}
  .status-line.err{color:var(--danger);}
  .status-line.ok{color:var(--accent);}
  .chart-wrap{overflow-x:auto;}
  .pin-wrap{position:relative;}
  .pin-wrap input{padding-inline-end:38px;}
  .pin-eye{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:10px;cursor:pointer;font-size:16px;user-select:none;background:transparent;border:none;padding:2px;color:var(--muted);}
</style>

<div id="loginScreen">
  <div id="loginBox" class="card">
    <div style="display:flex;justify-content:center;margin-bottom:14px;">
      <img src="/logo.png" alt="לוגו שולחן עבודה" class="logo-login">
    </div>
    <div class="muted" style="margin-bottom:18px;text-align:center;" id="loginSubtitle">כניסה למערכת ניהול</div>
    <div id="loginFormArea">
      <div class="row" style="flex-direction:column;align-items:stretch;gap:12px;">
        <input id="loginUsername" placeholder="שם משתמש" autocomplete="username">
        <div class="pin-wrap"><input id="loginPin" placeholder="קוד (4 ספרות)" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"><span class="pin-eye" onclick="togglePinVisibility('loginPin', this)">👁</span></div>
        <button id="loginBtn" onclick="doLogin()">כניסה</button>
        <div id="loginStatus" class="status-line"></div>
        <button class="secondary" onclick="showRegisterForm()">אין לי חשבון - הרשמה</button>
        <a href="#" onclick="showForgotForm();return false;" style="text-align:center;font-size:13px;">שכחתי את הקוד</a>
      </div>
    </div>
  </div>
</div>

<div id="appShell">
  <header>
    <div class="logo-row">
      <img src="/logo.png" alt="שולחן עבודה" class="logo-header">
      <div class="title">שולחן עבודה - ניהול</div>
    </div>
    <div class="row">
      <div class="bell" id="bellIcon" onclick="toggleNotifPanel()">🔔<span class="dot" id="bellDot" style="display:none;">0</span></div>
      <span class="muted" id="whoAmI"></span>
      <button class="secondary" onclick="logout()">יציאה</button>
    </div>
  </header>
  <nav id="navBar"></nav>
  <main id="mainArea"></main>
</div>

<script>
const API = "";
let TOKEN = localStorage.getItem("sulchan_token") || "";
let ME = null;
let BRANCHES = [];
let currentTab = "dashboard";

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("שגיאה " + res.status));
  return data;
}

function togglePinVisibility(inputId, eyeEl) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  eyeEl.textContent = showing ? "👁" : "🙈";
}
async function doLogin() {
  const username = document.getElementById("loginUsername").value.trim();
  const pin = document.getElementById("loginPin").value.trim();
  const statusEl = document.getElementById("loginStatus");
  statusEl.textContent = ""; statusEl.className = "status-line";
  if (!username || !pin) { statusEl.textContent = "נא להזין שם משתמש וקוד"; statusEl.className = "status-line err"; return; }
  try {
    const data = await api("/api/login", { method: "POST", body: { username, pin } });
    TOKEN = data.token;
    localStorage.setItem("sulchan_token", TOKEN);
    await boot();
  } catch (e) {
    statusEl.textContent = e.message; statusEl.className = "status-line err";
  }
}
function logout() {
  TOKEN = ""; localStorage.removeItem("sulchan_token"); ME = null;
  document.getElementById("appShell").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

// ---------- הרשמה עצמית (עובד רק אם מנהל כבר אישר את המייל מראש, ר' src/routes/auth.js) ----------
function showRegisterForm() {
  document.getElementById("loginSubtitle").textContent = "הרשמה - רק עם מייל שאושר מראש ע\"י מנהל";
  document.getElementById("loginFormArea").innerHTML = `
    <div class="row" style="flex-direction:column;align-items:stretch;gap:12px;">
      <input id="regEmail" placeholder="מייל (חייב להיות מאושר מראש)" type="email">
      <input id="regFullName" placeholder="שם מלא">
      <input id="regUsername" placeholder="שם משתמש">
      <div class="pin-wrap"><input id="regPin" placeholder="קוד חדש (4 ספרות)" type="password" inputmode="numeric" maxlength="4"><span class="pin-eye" onclick="togglePinVisibility('regPin', this)">👁</span></div>
      <input id="regPhone" placeholder="טלפון (רשות)">
      <button onclick="doRegister()">הרשמה</button>
      <div id="registerStatus" class="status-line"></div>
      <button class="secondary" onclick="showLoginForm()">יש לי כבר חשבון - כניסה</button>
    </div>`;
}
function showLoginForm() {
  document.getElementById("loginSubtitle").textContent = "כניסה למערכת ניהול";
  document.getElementById("loginFormArea").innerHTML = `
    <div class="row" style="flex-direction:column;align-items:stretch;gap:12px;">
      <input id="loginUsername" placeholder="שם משתמש" autocomplete="username">
      <div class="pin-wrap"><input id="loginPin" placeholder="קוד (4 ספרות)" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"><span class="pin-eye" onclick="togglePinVisibility('loginPin', this)">👁</span></div>
      <button id="loginBtn" onclick="doLogin()">כניסה</button>
      <div id="loginStatus" class="status-line"></div>
      <button class="secondary" onclick="showRegisterForm()">אין לי חשבון - הרשמה</button>
      <a href="#" onclick="showForgotForm();return false;" style="text-align:center;font-size:13px;">שכחתי את הקוד</a>
    </div>`;
}
function showForgotForm() {
  document.getElementById("loginSubtitle").textContent = "שחזור קוד";
  document.getElementById("loginFormArea").innerHTML = `
    <div class="row" style="flex-direction:column;align-items:stretch;gap:12px;">
      <input id="forgotUsername" placeholder="שם משתמש" autocomplete="username">
      <button onclick="requestResetCode()">שליחת קוד למייל</button>
      <div id="forgotStatus" class="status-line"></div>
      <div id="forgotStep2" style="display:none;">
        <input id="forgotCode" placeholder="קוד מהמייל (4 ספרות)" maxlength="4" style="margin-bottom:10px;">
        <div class="pin-wrap" style="margin-bottom:10px;"><input id="forgotNewPin" placeholder="קוד חדש (4 ספרות)" type="password" inputmode="numeric" maxlength="4"><span class="pin-eye" onclick="togglePinVisibility('forgotNewPin', this)">👁</span></div>
        <button onclick="confirmResetCode()">איפוס הקוד</button>
      </div>
      <button class="secondary" onclick="showLoginForm()">חזרה לכניסה</button>
    </div>`;
}
async function requestResetCode() {
  const username = document.getElementById("forgotUsername").value.trim();
  const statusEl = document.getElementById("forgotStatus");
  if (!username) { statusEl.textContent = "נא להזין שם משתמש"; statusEl.className = "status-line err"; return; }
  try {
    const data = await api("/api/forgot-password/request", { method: "POST", body: { username } });
    statusEl.textContent = data.message; statusEl.className = "status-line ok";
    document.getElementById("forgotStep2").style.display = "block";
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
async function confirmResetCode() {
  const username = document.getElementById("forgotUsername").value.trim();
  const code = document.getElementById("forgotCode").value.trim();
  const newPin = document.getElementById("forgotNewPin").value.trim();
  const statusEl = document.getElementById("forgotStatus");
  try {
    await api("/api/forgot-password/confirm", { method: "POST", body: { username, code, newPin } });
    statusEl.textContent = "הקוד אופס בהצלחה! אפשר להתחבר עכשיו."; statusEl.className = "status-line ok";
    setTimeout(showLoginForm, 1500);
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
async function doRegister() {
  const email = document.getElementById("regEmail").value.trim();
  const fullName = document.getElementById("regFullName").value.trim();
  const username = document.getElementById("regUsername").value.trim();
  const pin = document.getElementById("regPin").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const statusEl = document.getElementById("registerStatus");
  if (!email || !fullName || !username || !pin) { statusEl.textContent = "נא למלא את כל שדות החובה"; statusEl.className = "status-line err"; return; }
  try {
    const data = await api("/api/register", { method: "POST", body: { email, fullName, username, pin, phone } });
    TOKEN = data.token;
    localStorage.setItem("sulchan_token", TOKEN);
    await boot();
  } catch (e) {
    statusEl.textContent = e.message; statusEl.className = "status-line err";
  }
}

async function boot() {
  try {
    const data = await api("/api/me");
    ME = data.user;
  } catch (e) {
    logout(); return;
  }
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  document.getElementById("whoAmI").textContent = `${ME.fullName} (${ME.role === "admin" ? "מנהל" : "עובד"})`;
  const branchData = await api("/api/branches");
  BRANCHES = branchData.branches;
  buildNav();
  showTab(ME.role === "admin" ? "dashboard" : "myInstructions");
  if (ME.role === "admin") { loadNotifications(); setInterval(loadNotifications, 30000); }
}

function buildNav() {
  const tabs = ME.role === "admin"
    ? [["dashboard","לוח בקרה"],["branches","סניפים"],["beneficiariesAll","מוטבים"],["tablets","טאבלטים"],["instructions","הוראות"],["reports","דיווחים"],["chat","צ'אט"],["users","משתמשים"],["finance","כספים"],["minutesConverter","ממיר דקות"]]
    : [["myInstructions","ההוראות שלי"],["myReport","דיווח"],["chat","צ'אט"]];
  const nav = document.getElementById("navBar");
  nav.innerHTML = "";
  tabs.forEach(([key,label]) => {
    const btn = document.createElement("button");
    btn.textContent = label; btn.onclick = () => showTab(key);
    btn.id = "navtab_" + key;
    nav.appendChild(btn);
  });
}
function setActiveNav(key) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  const el = document.getElementById("navtab_" + key);
  if (el) el.classList.add("active");
}

function showTab(key) {
  currentTab = key;
  setActiveNav(key);
  const renderers = {
    dashboard: renderDashboard, branches: renderBranches, instructions: renderInstructions,
    reports: renderReports, chat: renderChatThreads, users: renderUsers, finance: renderFinance,
    myInstructions: renderMyInstructions, myReport: renderMyReport, minutesConverter: renderMinutesConverter,
    beneficiariesAll: renderBeneficiariesAll, tablets: renderTablets,
  };
  (renderers[key] || (() => {}))();
}

// "ממיר דקות" - כלי עצמאי ב-iframe (ר' src/server.js, /minutes-converter.html). לגמרי client-side -
// לא נוגע ב-API שלנו בכלל, וההיסטוריה שלו נשמרת ב-localStorage של ה-iframe עצמו (נפרד מהאתר הראשי).
function renderMinutesConverter() {
  const main = document.getElementById("mainArea");
  main.innerHTML = `<iframe src="/minutes-converter.html" title="ממיר דקות"
    style="width:100%;min-height:1000px;border:none;border-radius:var(--radius);background:var(--bg);"></iframe>`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s) { if (!s) return ""; return String(s).replace("T", " ").slice(0, 16); }

// ---------- לוח בקרה ----------
async function renderDashboard() {
  const main = document.getElementById("mainArea");
  main.innerHTML = "<div class='muted'>טוען...</div>";
  const [reportsData, instrData] = await Promise.all([api("/api/reports"), api("/api/instructions")]);
  const reports = reportsData.reports.slice(0, 10);
  const pendingInstr = instrData.instructions.filter(i => i.status === "pending").length;
  main.innerHTML = `
    <div class="grid3" style="margin-bottom:16px;">
      <div class="stat"><div class="n">${BRANCHES.length}</div><div class="l">סניפים פעילים</div></div>
      <div class="stat"><div class="n">${pendingInstr}</div><div class="l">הוראות ממתינות</div></div>
      <div class="stat"><div class="n">${reportsData.reports.length}</div><div class="l">סה"כ דיווחים</div></div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">דיווחים אחרונים</div>
      <table><thead><tr><th>סניף</th><th>עובד</th><th>הוראה</th><th>סטטוס</th><th>הערה</th><th>מתי</th></tr></thead>
      <tbody>${reports.map(r => `<tr><td>${esc(r.branch_name)}</td><td>${esc(r.worker_name)}</td>
        <td class="muted">${esc(r.instruction_text || "-")}</td>
        <td><span class="badge ${r.status_code}">${statusLabel(r.status_code)}</span></td>
        <td>${esc(r.note_text || "-")}</td><td class="muted">${fmtDate(r.created_at)}</td></tr>`).join("") || "<tr><td colspan='6' class='muted'>אין דיווחים עדיין</td></tr>"}
      </tbody></table>
    </div>`;
}
function statusLabel(code) {
  return { done: "בוצע", not_done: "לא בוצע", issue: "יש בעיה", skip: "דולג", other: "אחר" }[code] || code;
}

// ---------- סניפים ----------
async function renderBranches() {
  const main = document.getElementById("mainArea");
  main.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">הוספת סניף</div>
      <div class="row">
        <input id="newBranchName" placeholder="שם הסניף" style="flex:1;">
        <input id="newBranchAddress" placeholder="כתובת" style="flex:2;">
        <button onclick="addBranch()">הוספה</button>
      </div>
      <div id="branchStatus" class="status-line"></div>
    </div>
    <div class="card"><table><thead><tr><th>שם</th><th>כתובת</th><th>מוטבים</th><th>עמדות</th><th></th><th></th></tr></thead>
    <tbody id="branchesTableBody"></tbody></table></div>`;
  const tbody = document.getElementById("branchesTableBody");
  tbody.innerHTML = BRANCHES.map(b => `<tr>
    <td>${esc(b.name)}</td><td class="muted">${esc(b.address || "-")}</td>
    <td><button class="secondary" onclick="openBeneficiaries(${b.id}, '${esc(b.name).replace(/'/g,"\\'")}')">ניהול מוטבים</button></td>
    <td><button class="secondary" onclick="openStations(${b.id}, '${esc(b.name).replace(/'/g,"\\'")}')">ניהול עמדות</button></td>
    <td><button class="secondary" onclick="editBranch(${b.id}, '${safeStr(b.name)}', '${safeStr(b.address || "")}')">עריכה</button></td>
    <td><button class="danger" onclick="deleteBranch(${b.id})">מחיקה</button></td>
  </tr>`).join("");
}
async function openStations(branchId, branchName) {
  const data = await api(`/api/branches/${branchId}/stations`);
  const main = document.getElementById("mainArea");
  const bn = safeStr(branchName);
  main.innerHTML = `
    <button class="secondary" onclick="renderBranches()">→ חזרה לסניפים</button>
    <div style="font-weight:800;font-size:17px;margin:14px 0 4px;">עמדות - ${esc(branchName)}</div>

async function addStation(branchId, branchName) {

  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }

      </div>
      <textarea id="instrText" placeholder="תוכן ההוראה... (אותה הוראה תישלח לכל הצירופים שבחרתם)" rows="3"></textarea>

    </div>
    <div class="card"><table><thead><tr><th>סניף</th><th>עובד</th><th>הוראה</th><th>סטטוס</th><th>נשלח במייל</th><th>מתי</th></tr></thead>

function toggleAllCheckboxes(containerId) {
  const boxes = document.querySelectorAll(`#${containerId} input[type=checkbox]`);
  const allAlreadyChecked = Array.from(boxes).every(b => b.checked);
  boxes.forEach(b => { b.checked = !allAlreadyChecked; });
}
// כשנבחר סניף בודד (ולא כמה/אף אחד), מציגים את רשימת העמדות שלו לבחירה - "בחר הכל" או עמדות
// בודדות, בדיוק כמו הבחירה של סניפים/עובדים למעלה (ר' משוב המשתמש).
async function refreshStationHints() {
  const branchIds = Array.from(document.querySelectorAll("#instrBranchList input:checked")).map(b => Number(b.value));
  const wrap = document.getElementById("stationPickerWrap");
  const list = document.getElementById("instrStationList");
  if (branchIds.length !== 1) { wrap.style.display = "none"; list.innerHTML = ""; return; }
  const data = await api(`/api/branches/${branchIds[0]}/stations`);
  if (!data.stations.length) { wrap.style.display = "none"; list.innerHTML = ""; return; }
  list.innerHTML = data.stations.map(s => `<label class="row" style="margin-bottom:4px;">
    <input type="checkbox" style="width:auto;" value="${safeStr(s.number)}"> עמדה ${esc(s.number)}${s.group_label ? " - " + esc(s.group_label) : ""}
  </label>`).join("");
  wrap.style.display = "";
}
function addSelectedStationsToText() {
  const nums = Array.from(document.querySelectorAll("#instrStationList input:checked")).map(b => b.value);
  if (!nums.length) return;
  const ta = document.getElementById("instrText");
  const prefix = nums.length === 1 ? `עמדה ${nums[0]}` : `עמדות ${nums.join(", ")}`;
  ta.value = ta.value.trim() ? `${prefix} - ${ta.value.trim()}` : `${prefix} - `;
  ta.focus();
}
// מילון ביטויים שמורים - לחיצה על ביטוי מוסיפה אותו לתוכן ההוראה, כדי לא להקליד שוב ביטויים
// קצרים שחוזרים על עצמם (ר' משוב המשתמש).
let INSTRUCTION_PHRASES = [];
async function loadPhraseHints() {
  const el = document.getElementById("phraseHints");
  if (!el) return;
  try {
    const data = await api("/api/instruction-phrases");
    INSTRUCTION_PHRASES = data.phrases;
    el.innerHTML = INSTRUCTION_PHRASES.length
      ? `<span class="muted" style="font-size:12.5px;">ביטויים שמורים (לחצו להוספה):</span> ` +
        INSTRUCTION_PHRASES.map(p => `<button type="button" class="secondary" style="padding:2px 8px;font-size:11.5px;margin:2px;" onclick="insertPhraseIntoText('${safeStr(p.text)}')">${esc(p.text)}</button>`).join("")
      : "";
  } catch (e) { /* לא קריטי אם נכשל - הטופס עדיין עובד עם טקסט חופשי */ }
}
function insertPhraseIntoText(text) {
  const ta = document.getElementById("instrText");
  ta.value = ta.value.trim() ? `${ta.value.trim()} - ${text}` : text;
  ta.focus();
}
async function sendInstruction() {
  const branchIds = Array.from(document.querySelectorAll("#instrBranchList input:checked")).map(b => Number(b.value));
  const workerUserIds = Array.from(document.querySelectorAll("#instrWorkerList input:checked")).map(b => Number(b.value));
  const text = document.getElementById("instrText").value.trim();
  const statusEl = document.getElementById("instrStatus");
  if (!branchIds.length || !workerUserIds.length) { statusEl.textContent = "בחרו לפחות סניף אחד ועובד אחד"; statusEl.className = "status-line err"; return; }
  if (!text) { statusEl.textContent = "נא להזין תוכן הוראה"; statusEl.className = "status-line err"; return; }
  try {
    const res = await api("/api/instructions", { method: "POST", body: { branchIds, workerUserIds, text } });
    statusEl.textContent = `נוצרו ${res.created} הוראות (${res.emailsSent} נשלחו במייל בהצלחה).`; statusEl.className = "status-line ok";
    // הצעה לשמור ביטוי קצר וחדש למילון לשימוש מהיר בפעם הבאה (ר' משוב המשתמש).
    if (text.length <= 40 && !INSTRUCTION_PHRASES.some(p => p.text === text)) {
      if (confirm(`לשמור את "${text}" למילון הביטויים לשימוש מהיר בפעם הבאה?`)) {
        await api("/api/instruction-phrases", { method: "POST", body: { text } });
      }
    }
    renderInstructions();
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}

// ---------- משתמשים (מנהל) ----------

  const pendingInvites = invitesData.invites.filter(i => !i.used_at);
  const usedInvites = invitesData.invites.filter(i => i.used_at);
  main.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">הרשמה עצמית - מיילים מאושרים</div>
      <div class="muted" style="margin-bottom:10px;">מי שיירשם בעצמו בעמוד הכניסה ("הרשמה") יצליח רק אם המייל שלו כאן.</div>
      <div class="row" style="margin-bottom:10px;">
        <input id="inviteEmail" placeholder="מייל" type="email" style="flex:1;">
        <select id="inviteRole" style="width:120px;"><option value="worker">עובד</option><option value="admin">מנהל</option></select>
        <button onclick="addInvite()">הוספה</button>
      </div>
      <div id="inviteStatus" class="status-line"></div>
      ${pendingInvites.length ? `<table><thead><tr><th>מייל</th><th>תפקיד</th><th></th></tr></thead>
      <tbody>${pendingInvites.map(i => `<tr><td>${esc(i.email)}</td><td>${i.role === "admin" ? "מנהל" : "עובד"}</td>
        <td><button class="danger" onclick="deleteInvite(${i.id})">ביטול</button></td></tr>`).join("")}</tbody></table>` : "<div class='muted'>אין מיילים ממתינים כרגע</div>"}
      ${usedInvites.length ? `<div class="muted" style="margin-top:10px;">כבר נרשמו: ${usedInvites.map(i => esc(i.email) + " (" + esc(i.used_by_name || "") + ")").join(", ")}</div>` : ""}
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">הוספת משתמש (ישירות, ע"י מנהל)</div>
      <div class="row" style="margin-bottom:8px;">
        <input id="uFullName" placeholder="שם מלא" style="flex:1;">
        <input id="uUsername" placeholder="שם משתמש" style="flex:1;">
        <input id="uPin" placeholder="קוד 4 ספרות" maxlength="4" style="width:120px;">
        <select id="uRole" style="width:120px;"><option value="worker">עובד</option><option value="admin">מנהל</option></select>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <input id="uPhone" placeholder="טלפון (לזיהוי בשלוחה)" style="flex:1;">
        <input id="uEmail" placeholder="מייל" style="flex:1;">
      </div>
      <button onclick="addUser()">הוספה</button>
      <div id="userStatus" class="status-line"></div>
    </div>
    <div class="card"><table><thead><tr><th>שם</th><th>שם משתמש</th><th>תפקיד</th><th>טלפון</th><th>מייל</th><th>סניפים</th><th></th></tr></thead>
    <tbody>${data.users.filter(u => u.active).map(u => `<tr><td>${esc(u.full_name)}
        <button class="secondary" style="padding:2px 8px;font-size:11.5px;margin-inline-start:6px;" onclick="editUserName(${u.id}, '${esc(u.full_name).replace(/'/g,"\\'")}')">✎</button></td>
      <td class="muted">${esc(u.username)}</td>
      <td>${u.role === "admin" ? "מנהל" : "עובד"}</td><td>${esc(u.phone||"-")}</td>
      <td>${esc(u.email||"-")} <button class="secondary" style="padding:2px 8px;font-size:11.5px;" onclick="editUserEmail(${u.id}, '${esc(u.email||"").replace(/'/g,"\\'")}')">✎</button></td>
      <td><button class="secondary" onclick="openWorkerBranches(${u.id}, '${esc(u.full_name).replace(/'/g,"\\'")}')">שיוך סניפים</button></td>
      <td class="row" style="gap:6px;flex-wrap:nowrap;">
        <button class="secondary" onclick="editUserPin(${u.id})">שינוי קוד</button>
        <button class="danger" onclick="deleteUser(${u.id}, '${esc(u.full_name).replace(/'/g,"\\'")}')">מחיקה</button>
      </td>
    </tr>`).join("")}</tbody></table></div>`;
}
async function addInvite() {
  const email = document.getElementById("inviteEmail").value.trim();
  const role = document.getElementById("inviteRole").value;
  const statusEl = document.getElementById("inviteStatus");
  if (!email) { statusEl.textContent = "נא להזין מייל"; statusEl.className = "status-line err"; return; }
  try {
    await api("/api/invites", { method: "POST", body: { email, role } });
    statusEl.textContent = "נוסף בהצלחה"; statusEl.className = "status-line ok";
    renderUsers();
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
async function deleteInvite(id) {
  await api("/api/invites/" + id, { method: "DELETE" });
  renderUsers();
}
async function editUserName(id, currentName) {
  const newName = prompt("שם מלא חדש:", currentName);
  if (newName === null || !newName.trim()) return;
  await api(`/api/users/${id}`, { method: "PUT", body: { fullName: newName.trim() } });
  renderUsers();
}
async function editUserEmail(id, currentEmail) {
  const newEmail = prompt("מייל חדש (חשוב במיוחד עבור 'שכחתי סיסמה'):", currentEmail);
  if (newEmail === null) return;
  await api(`/api/users/${id}`, { method: "PUT", body: { email: newEmail.trim() } });
  renderUsers();
}
async function editUserPin(id) {
  const newPin = prompt("קוד חדש (4 ספרות בדיוק):");
  if (newPin === null) return;
  if (!/^\d{4}$/.test(newPin.trim())) { alert("הקוד חייב להיות בדיוק 4 ספרות"); return; }
  await api(`/api/users/${id}`, { method: "PUT", body: { pin: newPin.trim() } });
  alert("הקוד עודכן בהצלחה");
  renderUsers();
}
async function deleteUser(id, fullName) {
  if (!confirm(`למחוק את ${fullName}? (ניתן ליצור מחדש בעתיד, אך לא לשחזר את אותו חשבון)`)) return;
  await api(`/api/users/${id}`, { method: "PUT", body: { active: false } });
  renderUsers();
}
async function addUser() {
  const fullName = document.getElementById("uFullName").value.trim();
  const username = document.getElementById("uUsername").value.trim();
  const pin = document.getElementById("uPin").value.trim();
  const role = document.getElementById("uRole").value;
  const phone = document.getElementById("uPhone").value.trim();
  const email = document.getElementById("uEmail").value.trim();
  const statusEl = document.getElementById("userStatus");
  try {
    await api("/api/users", { method: "POST", body: { fullName, username, pin, role, phone, email } });
    statusEl.textContent = "נוסף בהצלחה"; statusEl.className = "status-line ok";
    renderUsers();
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
async function openWorkerBranches(workerId, workerName) {
  const [assigned, all] = await Promise.all([api(`/api/users/${workerId}/branches`), Promise.resolve({ branches: BRANCHES })]);
  const assignedIds = new Set(assigned.branches.map(b => b.id));
  const main = document.getElementById("mainArea");
  main.innerHTML = `
    <button class="secondary" onclick="renderUsers()">→ חזרה למשתמשים</button>
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between;margin-bottom:10px;">
        <div style="font-weight:700;">סניפים המשויכים ל${esc(workerName)}</div>
        <button class="secondary" onclick="selectAllWorkerBranches(${workerId}, '${esc(workerName).replace(/'/g,"\\'")}')">סמן הכל</button>
      </div>
      <div id="branchCheckboxList">
      ${all.branches.map(b => `<label class="row" style="margin-bottom:6px;">
        <input type="checkbox" style="width:auto;" data-branch-id="${b.id}" ${assignedIds.has(b.id) ? "checked" : ""}
          onchange="toggleWorkerBranch(${workerId}, ${b.id}, this.checked, '${esc(workerName).replace(/'/g,"\\'")}')">
        ${esc(b.name)}</label>`).join("")}
      </div>
    </div>`;
}
async function selectAllWorkerBranches(workerId, workerName) {
  const boxes = document.querySelectorAll("#branchCheckboxList input[type=checkbox]:not(:checked)");
  for (const box of boxes) {
    await api(`/api/users/${workerId}/branches`, { method: "POST", body: { branchId: Number(box.dataset.branchId) } });
  }
  openWorkerBranches(workerId, workerName);
}
async function toggleWorkerBranch(workerId, branchId, checked, workerName) {
  if (checked) await api(`/api/users/${workerId}/branches`, { method: "POST", body: { branchId } });
  else await api(`/api/users/${workerId}/branches/${branchId}`, { method: "DELETE" });
}

// ---------- צ'אט ----------
async function renderChatThreads() {
  const main = document.getElementById("mainArea");
  if (ME.role === "worker") {
    // עובד: בוחר סניף מתוך המשויכים לו ופותח צ'אט ישירות
    const data = await api(`/api/users/${ME.id}/branches`);
    if (!data.branches.length) { main.innerHTML = "<div class='card muted'>אינכם משויכים לאף סניף עדיין.</div>"; return; }
    main.innerHTML = `<div class="card"><div class="row">${data.branches.map(b =>
      `<button class="secondary" onclick="openChat(${b.id}, ${ME.id})">${esc(b.name)}</button>`).join("")}</div></div>
      <div id="chatArea"></div>`;
    if (data.branches.length === 1) openChat(data.branches[0].id, ME.id);
    return;
  }
  const [data, usersData, adminPeers, adminThreads] = await Promise.all([
    api("/api/chat/threads"), api("/api/users"), api("/api/admin-chat/peers"), api("/api/admin-chat/threads"),
  ]);
  const workers = usersData.users.filter(u => u.role === "worker" && u.active);
  main.innerHTML = `
    <div style="font-weight:800;font-size:16px;margin-bottom:8px;">צ'אט עם מנהלים</div>
    <div class="card">
      <div class="row">
        <select id="newAdminChatPeer" style="flex:1;">
          <option value="">- בחרו מנהל -</option>${adminPeers.peers.map(p => `<option value="${p.id}">${esc(p.full_name)}</option>`).join("")}
        </select>
        <button onclick="startAdminChat()">התחלה</button>
      </div>
      ${adminThreads.threads.length ? `<table style="margin-top:10px;"><thead><tr><th>מנהל</th><th>הודעה אחרונה</th><th>לא נקראו</th><th></th></tr></thead>
      <tbody>${adminThreads.threads.map(t => `<tr><td>${esc(t.peer_name)}</td><td class="muted">${fmtDate(t.last_message_at)}</td>
        <td>${t.unread_count > 0 ? `<span class="badge pending">${t.unread_count}</span>` : "-"}</td>
        <td><button class="secondary" onclick="openAdminChat(${t.peer_id})">פתיחה</button></td></tr>`).join("")}</tbody></table>` : ""}
    </div>
    <div id="adminChatArea"></div>

    <div style="font-weight:800;font-size:16px;margin:20px 0 8px;">צ'אט עם עובדים</div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">שיחה חדשה / הודעה חדשה</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;">
        <div>
          <div class="row" style="justify-content:space-between;margin-bottom:6px;">
            <span class="muted" style="font-size:12.5px;">סניפים</span>
            <button class="secondary" style="padding:3px 10px;font-size:11.5px;" onclick="toggleAllCheckboxes('chatBranchList')">בחר הכל</button>
          </div>
          <div id="chatBranchList" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;">
            ${BRANCHES.map(b => `<label class="row" style="margin-bottom:4px;"><input type="checkbox" style="width:auto;" value="${b.id}"> ${esc(b.name)}</label>`).join("")}
          </div>
        </div>
        <div>
          <div class="row" style="justify-content:space-between;margin-bottom:6px;">
            <span class="muted" style="font-size:12.5px;">עובדים</span>
            <button class="secondary" style="padding:3px 10px;font-size:11.5px;" onclick="toggleAllCheckboxes('chatWorkerList')">בחר הכל (כולם)</button>
          </div>
          <div id="chatWorkerList" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;">
            ${workers.map(w => `<label class="row" style="margin-bottom:4px;"><input type="checkbox" style="width:auto;" value="${w.id}"> ${esc(w.full_name)}</label>`).join("") || "<span class='muted'>אין עובדים - הוסיפו בטאב משתמשים</span>"}
          </div>
        </div>
      </div>
      <textarea id="newChatText" placeholder="תוכן ההודעה... (אותה הודעה תישלח לכל הצירופים שבחרתם)" rows="3"></textarea>
      <div class="row" style="margin-top:8px;"><button onclick="startNewChat()" ${workers.length ? "" : "disabled"}>שליחה</button></div>
      <div id="newChatStatus" class="status-line"></div>
    </div>
    <div class="card"><table><thead><tr><th>סניף</th><th>עובד</th><th>הודעה אחרונה</th><th>לא נקראו</th><th></th></tr></thead>
    <tbody>${data.threads.map(t => `<tr><td>${esc(t.branch_name)}</td><td>${esc(t.worker_name)}</td>
      <td class="muted">${fmtDate(t.last_message_at)}</td><td>${t.unread_count > 0 ? `<span class="badge pending">${t.unread_count}</span>` : "-"}</td>
      <td><button class="secondary" onclick="openChat(${t.branch_id}, ${t.worker_user_id})">פתיחה</button></td></tr>`).join("") || "<tr><td colspan='5' class='muted'>אין שיחות עדיין</td></tr>"}
    </tbody></table></div><div id="chatArea"></div>`;
}
function startAdminChat() {
  const peerId = document.getElementById("newAdminChatPeer").value;
  if (!peerId) return;
  openAdminChat(Number(peerId));
}
async function openAdminChat(peerId) {
  const data = await api(`/api/admin-chat/${peerId}`);
  const area = document.getElementById("adminChatArea");
  area.innerHTML = `<div class="card">
    <div id="adminChatMessages" style="max-height:400px;overflow-y:auto;display:flex;flex-direction:column;margin-bottom:12px;">
      ${data.messages.map(m => `<div class="msg ${m.sender_user_id === ME.id ? 'mine' : 'theirs'}">
        ${esc(m.text)}<div class="meta">${esc(m.sender_name)} · ${fmtDate(m.created_at)}
          <span style="cursor:pointer;margin-inline-start:6px;" onclick="deleteAdminChatMessage(${m.id}, ${peerId})">🗑️</span></div></div>`).join("") || "<div class='muted'>אין הודעות עדיין</div>"}
    </div>
    <div class="row"><input id="adminChatInput" placeholder="הודעה..." style="flex:1;" onkeydown="if(event.key==='Enter')sendAdminChat(${peerId})">
      <button onclick="sendAdminChat(${peerId})">שליחה</button></div>
  </div>`;
  area.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function sendAdminChat(peerId) {
  const input = document.getElementById("adminChatInput");
  const text = input.value.trim();
  if (!text) return;
  await api(`/api/admin-chat/${peerId}`, { method: "POST", body: { text } });
  input.value = "";
  openAdminChat(peerId);
}
async function deleteAdminChatMessage(id, peerId) {
  if (!confirm("למחוק את ההודעה?")) return;
  await api("/api/admin-chat/message/" + id, { method: "DELETE" });
  openAdminChat(peerId);
}
async function startNewChat() {
  const branchIds = Array.from(document.querySelectorAll("#chatBranchList input:checked")).map(b => Number(b.value));
  const workerUserIds = Array.from(document.querySelectorAll("#chatWorkerList input:checked")).map(b => Number(b.value));
  const text = document.getElementById("newChatText").value.trim();
  const statusEl = document.getElementById("newChatStatus");
  if (!branchIds.length || !workerUserIds.length) { statusEl.textContent = "בחרו לפחות סניף אחד ועובד אחד"; statusEl.className = "status-line err"; return; }
  if (!text) { statusEl.textContent = "נא להזין תוכן הודעה"; statusEl.className = "status-line err"; return; }
  try {
    const res = await api("/api/chat/bulk", { method: "POST", body: { branchIds, workerUserIds, text } });
    statusEl.textContent = `נשלחו ${res.created} הודעות (${res.emailsSent} מיילים מרוכזים נשלחו בהצלחה).`; statusEl.className = "status-line ok";
    document.getElementById("newChatText").value = "";
    renderChatThreads();
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
async function openChat(branchId, workerId) {
  const data = await api(`/api/chat/${branchId}/${workerId}`);
  const area = document.getElementById("chatArea") || document.getElementById("mainArea");
  area.innerHTML = `<div class="card">
    ${ME.role === "admin" ? `<div class="row" style="justify-content:flex-end;margin-bottom:8px;">
      <button class="secondary" onclick="markChatPending(${branchId}, ${workerId})">🔖 סמן כממתין לטיפול (כמו לא-נקרא)</button>
    </div>` : ""}
    <div id="chatMessages" style="max-height:400px;overflow-y:auto;display:flex;flex-direction:column;margin-bottom:12px;">
      ${data.messages.map(m => `<div class="msg ${m.sender_user_id === ME.id ? 'mine' : 'theirs'}">
        ${esc(m.text)}<div class="meta">${esc(m.sender_name)} · ${fmtDate(m.created_at)}
          ${ME.role === "admin" || m.sender_user_id === ME.id ? `<span style="cursor:pointer;margin-inline-start:6px;" onclick="deleteChatMessage(${m.id}, ${branchId}, ${workerId})">🗑️</span>` : ""}</div></div>`).join("") || "<div class='muted'>אין הודעות עדיין</div>"}
    </div>
    <div class="row"><input id="chatInput" placeholder="הודעה..." style="flex:1;" onkeydown="if(event.key==='Enter')sendChat(${branchId},${workerId})">
      <button onclick="sendChat(${branchId},${workerId})">שליחה</button></div>
  </div>`;
  area.scrollIntoView({ behavior: "smooth", block: "start" });
}
// משאיר את השרשור כ"ממתין לטיפול המשך" - מחזיר את התג האדום (לא-נקרא) ברשימת השרשורים, בלי
// למחוק כלום, גם אחרי שכבר נקרא (ר' משוב המשתמש).
async function markChatPending(branchId, workerId) {
  await api(`/api/chat/${branchId}/${workerId}/mark-pending`, { method: "PUT" });
  renderChatThreads();
}
async function deleteChatMessage(id, branchId, workerId) {
  if (!confirm("למחוק את ההודעה?")) return;
  await api("/api/chat/message/" + id, { method: "DELETE" });
  openChat(branchId, workerId);
}
async function sendChat(branchId, workerId) {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  await api(`/api/chat/${branchId}/${workerId}`, { method: "POST", body: { text } });
  input.value = "";
  openChat(branchId, workerId);
}

    </div>

        <select id="paymentMethodFilter" style="width:160px;" onchange="financePaymentFilter=this.value;renderFinanceTable();">
          <option value="all">כל התנועות</option>

      <tbody id="financeTableBody"></tbody></table>

function renderFinanceTable() {
  const tbody = document.getElementById("financeTableBody");
  if (!tbody || !LAST_TX_DATA) return;
  const rows = LAST_TX_DATA.transactions.filter(t => financePaymentFilter === "all" || t.payment_method === financePaymentFilter).slice(0, 50);
  const paymentLabel = { card: "כרטיס אשראי", bank: "בנק" };
  tbody.innerHTML = rows.map(t => `<tr><td class="muted">${fmtDate(t.occurred_at)}</td>

      <button class="secondary" style="padding:2px 8px;font-size:11.5px;" onclick="editTransactionCategory(${t.id}, '${esc(t.category||"").replace(/'/g,"\\'")}')">✎</button></span></td>
    <td>${esc(t.branch_name||"-")}</td><td class="muted">${paymentLabel[t.payment_method] || "-"}</td>
    <td><button class="danger" onclick="deleteTransaction(${t.id})">מחיקה</button></td></tr>`).join("")
    || "<tr><td colspan='7' class='muted'>אין תנועות תואמות</td></tr>";

async function downloadDocument(id, filename) {
  const res = await fetch("/api/documents/" + id + "/download", { headers: { Authorization: "Bearer " + TOKEN } });
  if (!res.ok) { alert("הורדת הקובץ נכשלה"); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function trunc(n) { return Math.round(n).toLocaleString("he-IL"); }

async function editTransactionCategory(id, currentCategory) {

function renderTrendChart(trend) {
  if (!trend.length) return "<div class='muted'>אין עדיין מספיק נתונים לגרף</div>";
  const w = Math.max(400, trend.length * 70), h = 200, pad = 30;
  const maxVal = Math.max(1, ...trend.map(t => Math.max(t.income, t.expense)));
  const barW = 18;
  let bars = "";
  trend.forEach((t, i) => {
    const x = pad + i * ((w - pad * 2) / trend.length) + 10;
    const incH = (t.income / maxVal) * (h - pad * 2);
    const expH = (t.expense / maxVal) * (h - pad * 2);
    bars += `<rect x="${x}" y="${h - pad - incH}" width="${barW}" height="${incH}" fill="var(--accent)"></rect>`;
    bars += `<rect x="${x + barW + 3}" y="${h - pad - expH}" width="${barW}" height="${expH}" fill="var(--danger)"></rect>`;
    bars += `<text x="${x + barW}" y="${h - 8}" font-size="10" fill="var(--muted)" text-anchor="middle">${t.month.slice(5)}</text>`;
  });
  return `<svg width="${w}" height="${h}" style="color:var(--text);">
    <style>rect{opacity:.9;} text{font-family:'JetBrains Mono',monospace;}</style>
    ${bars}<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"></line>
  </svg>
  <div class="row" style="margin-top:6px;"><span class="muted">🟩 הכנסות</span><span class="muted">🟥 הוצאות</span></div>`;
}

// גרף עיגול (donut) - הוצאות לפי קטגוריה. בלי ספריית גרפים, בדיוק כמו ב"הפנקס שלי" - מגביל ל-6
// קטגוריות + "אחר" מקופל, כדי שהגרף יישאר קריא גם עם הרבה קטגוריות שונות.
const DONUT_COLORS = ["#2fb08d", "#e8a33d", "#d9614f", "#5b8def", "#b06fd6", "#4fb8c4", "#8c94a6"];
function renderDonutChart(byCategory) {
  const entries = Object.entries(byCategory || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return "<div class='muted'>אין עדיין הוצאות לגרף</div>";
  let shown = entries.slice(0, 6);
  const rest = entries.slice(6);
  if (rest.length) {
    const restTotal = rest.reduce((s, [, v]) => s + v, 0);
    shown.push(["אחר", restTotal]);
  }
  const total = shown.reduce((s, [, v]) => s + v, 0) || 1;
  const size = 200, r = 70, cx = size / 2, cy = size / 2, circumference = 2 * Math.PI * r;
  let offset = 0;
  const segments = shown.map(([cat, val], i) => {
    const frac = val / total;
    const dash = frac * circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}"
      stroke-width="28" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += dash;
    return seg;
  }).join("");
  const legend = shown.map(([cat, val], i) => `<div class="row" style="gap:6px;margin-bottom:4px;">
    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${DONUT_COLORS[i % DONUT_COLORS.length]};"></span>
    <span class="muted">${esc(cat)} — ₪${trunc(val)}</span></div>`).join("");
  return `<div class="row" style="align-items:center;gap:20px;flex-wrap:wrap;">
    <svg width="${size}" height="${size}">${segments}</svg>
    <div>${legend}</div>
  </div>`;
}

let LAST_PARSED_ROWS = [];
let LAST_PARSED_FILE = null; // { data_base64, filename, mime_type, source_type } - נשלח שוב ב-commit כדי לשמור את הקובץ המקורי (ר' downloadDocument)
async function parseImportFile() {
  const fileInput = document.getElementById("importFile");
  const statusEl = document.getElementById("importStatus");
  if (!fileInput.files.length) { statusEl.textContent = "בחרו קובץ"; statusEl.className = "status-line err"; return; }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = btoa(new Uint8Array(e.target.result).reduce((s, b) => s + String.fromCharCode(b), ""));
    const sourceType = document.getElementById("importSourceType").value;
    try {
      const data = await api("/api/transactions/import/parse", { method: "POST", body: {
        data_base64: base64, filename: file.name, source_type: sourceType,
      }});
      LAST_PARSED_ROWS = data.transactions;
      LAST_PARSED_FILE = { data_base64: base64, filename: file.name, mime_type: file.type || null, source_type: sourceType };
      statusEl.textContent = `נמצאו ${data.transactions.length} תנועות. בדקו ולחצו "ייבוא בפועל".`; statusEl.className = "status-line ok";
      document.getElementById("importPreview").innerHTML = `
        <table style="margin-top:10px;"><thead><tr><th>תאריך</th><th>סוג</th><th>סכום</th><th>תיאור</th></tr></thead>
        <tbody>${data.transactions.slice(0,30).map(t => `<tr><td>${t.date}</td><td>${t.type==='income'?'הכנסה':'הוצאה'}</td><td>₪${t.amount}</td><td>${esc(t.description||"")}</td></tr>`).join("")}</tbody></table>
        <button onclick="commitImport()" style="margin-top:10px;">ייבוא בפועל (${data.transactions.length} תנועות)</button>`;
    } catch (err) { statusEl.textContent = err.message; statusEl.className = "status-line err"; }
  };
  reader.readAsArrayBuffer(file);
}
async function commitImport() {
  const statusEl = document.getElementById("importStatus");
  try {
    const res = await api("/api/transactions/import/commit", { method: "POST", body: {
      transactions: LAST_PARSED_ROWS, ...(LAST_PARSED_FILE || {}),
    }});
    statusEl.textContent = `יובאו ${res.imported} תנועות (${res.skippedDuplicates} כפילויות דולגו).`; statusEl.className = "status-line ok";
    renderFinance();
  } catch (e) { statusEl.textContent = e.message; statusEl.className = "status-line err"; }
}
